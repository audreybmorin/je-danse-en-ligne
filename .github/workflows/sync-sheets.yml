name: Sync vers Google Sheets

on:
  push:
    branches:
      - main
    paths:
      - 'donnees.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Envoyer les soirées
        run: |
          SOIREES=$(jq '{onglet: "Soirées", lignes: [.soirees[] | [
            .["Type"], .["Organisateur"], .["Association"],
            .["Lieu / Centre"], .["Adresse"], .["Récurrent"],
            .["Jour(s)"], .["Heure début"], .["Heure fin"],
            .["Date début"], .["Date fin"], .["Prix"],
            .["Précisions"], .["URL source"], .["URL association"],
            .["Saison"], .["Lieu type"]
          ]]}' donnees.json)
          # Sans -X POST : curl suit la redirection d'Apps Script en GET pour lire la réponse
          REPONSE=$(curl -sS -L "${{ secrets.APPS_SCRIPT_URL }}" \
            -H "Content-Type: application/json" \
            --data "$SOIREES")
          echo "$REPONSE"
          ATTENDU=$(jq '.soirees | length' donnees.json)
          if ! echo "$REPONSE" | jq -e --argjson n "$ATTENDU" '.succes == true and .lignes == $n' > /dev/null; then
            echo "::error::Échec de l'envoi des soirées vers Google Sheets"
            exit 1
          fi

      - name: Envoyer les cours
        run: |
          COURS=$(jq '{onglet: "Cours", lignes: [.cours[] | [
            .["Organisateur"], .["Association"],
            .["Lieu / Centre"], .["Adresse"],
            .["Jour(s)"], .["Heure début"], .["Heure fin"],
            .["Date début"], .["Date fin"], .["Prix"],
            .["Niveau"], .["Précisions"],
            .["URL source"], .["URL association"],
            .["Saison"], .["Lieu type"]
          ]]}' donnees.json)
          # Sans -X POST : curl suit la redirection d'Apps Script en GET pour lire la réponse
          REPONSE=$(curl -sS -L "${{ secrets.APPS_SCRIPT_URL }}" \
            -H "Content-Type: application/json" \
            --data "$COURS")
          echo "$REPONSE"
          ATTENDU=$(jq '.cours | length' donnees.json)
          if ! echo "$REPONSE" | jq -e --argjson n "$ATTENDU" '.succes == true and .lignes == $n' > /dev/null; then
            echo "::error::Échec de l'envoi des cours vers Google Sheets"
            exit 1
          fi

      - name: Générer la page statique evenements.html
        run: python3 generer_statique.py

      - name: Publier evenements.html sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evenements.html
          git diff --staged --quiet || git commit -m "Mise à jour automatique evenements.html"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
